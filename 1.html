<!DOCTYPE html>

<head>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #000000;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        
        .container {

.avatar {
    width: 260px;
    height: 260px;
    margin: 0 auto 22px;
    display: block;
    border-radius: 50%;
    object-fit: cover;
    border: 6px solid #A9A9A9; /* abu metallic midtone */
    box-shadow: 0 0 12px #E6E6E6, 0 0 28px rgba(166, 166, 166, 0.35);
    animation: glow 3s ease-in-out infinite;
}

@keyframes glow {
    0%, 100% {
        box-shadow: 0 0 12px #E6E6E6, 0 0 30px rgba(169, 169, 169, 0.25);
    }
    50% {
        box-shadow: 0 0 24px #FFFFFF, 0 0 60px rgba(255, 255, 255, 0.5);
    }
}

h1 {
    margin: 8px 0 10px;
    font-size: clamp(22px, 5vw, 36px);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    background: linear-gradient(to bottom, #E6E6E6, #A9A9A9, #4D4D4D);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 14px rgba(255, 255, 255, 0.5), 0 0 40px rgba(200, 200, 200, 0.3);
}

.sub {
    margin-bottom: 20px;
    font-size: 14px;
    color: #A9A9A9; /* abu midtone */

}

.block {
    background: #111;
    padding: 16px;
    border-radius: 10px;
    font-size: 16px;
    line-height: 1.6;
    color: #E6E6E6; /* abu terang */
    border-left: 4px solid #A9A9A9;
    text-align: left;
}

.block b {
    color: #FFFFFF; /* putih agar kontras */
}
        
        .footer {

</head>
<body>

    <audio id="bgMusic" src="https://l.top4top.io/m_3528vip0k1.mp3"></audio>

    <script>
